services:
  web:
    image: node:24-alpine
    container_name: toth-web
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      DEV_API_PROXY_PORT: ${NGINX_PORT:-8080}
    command: sh -c "npm ci && npm run dev"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: toth-api
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      postgres-vector:
        condition: service_healthy
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: toth-queue
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    command: php artisan queue:work redis --queue=default,redis --sleep=1 --tries=3 --timeout=300
    depends_on:
      - api
      - redis
      - postgres-vector
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: toth-reverb
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    ports:
      - "${REVERB_PORT:-8081}:8081"
    depends_on:
      - api
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: toth-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./api:/var/www/html:ro
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: toth-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: toth
      MYSQL_USER: toth
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.4-alpine
    container_name: toth-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: toth-postgres-vector
    ports:
      - "${POSTGRES_VECTOR_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: toth_vectors
      POSTGRES_USER: toth
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_vector_data:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toth -d toth_vectors"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: toth-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  web_node_modules:
  mysql_data:
  redis_data:
  postgres_vector_data:
